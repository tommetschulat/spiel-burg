<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Burg-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2f5d34; --panel:#3b2a1a; --text:#fff8e7; --gold:#ffcf3f;
  --btn:#7a5230; --btn-hi:#94653a; --btn-off:#4f4134; --accent:#e8573c;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1d3a21; } }
:root[data-theme="dark"]{ --bg:#1d3a21; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{display:block;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:crosshair}
#bar{display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);justify-content:center;flex-wrap:wrap}
.up{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:5px 8px;
  border:0;border-radius:12px;background:var(--btn);color:var(--text);font:inherit;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,background .15s}
.up:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.up:hover:not(:disabled){background:var(--btn-hi)}
.up:disabled{background:var(--btn-off);opacity:.65;cursor:default}
.up .ico{font-size:22px;line-height:1}
.up .nm{font-size:13px;font-weight:600;white-space:nowrap}
.up .cost{font-size:13px;color:var(--gold);font-weight:700}
.up .lv{font-size:11px;opacity:.8}
#pauseBtn{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;display:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(10,20,10,.55);padding:16px}
#overlay.hidden{display:none}
.card{background:#fff8e7;color:#3b2a1a;border-radius:20px;padding:24px 28px;max-width:440px;width:100%;
  text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.card h1{margin:0 0 4px;font-size:40px;color:#8b3a1e}
.card .sub{margin:0 0 16px;font-size:16px;opacity:.75}
.card ul{text-align:left;margin:0 0 20px;padding-left:20px;line-height:1.5;font-size:16px}
.card .big{display:inline-block;border:0;border-radius:14px;background:var(--accent);color:#fff;
  font:inherit;font-size:24px;font-weight:700;padding:12px 36px;cursor:pointer;box-shadow:0 4px 0 #9c3420}
.card .big:active{transform:translateY(2px);box-shadow:0 2px 0 #9c3420}
.card .stat{font-size:20px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
    <div id="overlay"></div>
  </div>
  <div id="bar"></div>
</div>

<script>
'use strict';
// ====== Spielwelt ======
const W = 1000, H = 700;
const WALL = { l: 370, r: 630, t: 220, b: 480 };
const GATE = { x: 500, y: 480, w: 56 };
const TOWERS = [[370, 220], [630, 220], [370, 480], [630, 480]];
const MOAT = { inner: 36, outer: 72 };   // Abstand des Wassergrabens zur Mauer
const BRIDGE_LEN = MOAT.outer - 11 + 4; // Zugbrücke vom Tor bis übers Wasser
const HUD_COIN = { x: 250, y: 34 };

const ENEMY_TYPES = {
  goblin:   { name: 'Goblin',          from: 1, weight: 10, hp: 3,  speed: 55, dmg: 2,  coins: 2,  r: 11, body: '#63b33c', dark: '#2f6a1a' },
  ork:      { name: 'Ork',             from: 2, weight: 7,  hp: 7,  speed: 38, dmg: 4,  coins: 4,  r: 15, body: '#7f9a3e', dark: '#3d5220' },
  skelett:  { name: 'Skelett',         from: 3, weight: 6,  hp: 6,  speed: 50, dmg: 3,  coins: 4,  r: 13, body: '#eeeae0', dark: '#8c867a' },
  troll:    { name: 'Troll',           from: 4, weight: 3,  hp: 22, speed: 24, dmg: 9,  coins: 10, r: 21, body: '#7d8fa6', dark: '#435468' },
  fledermaus: { name: 'Riesenfledermaus', from: 5, weight: 5, hp: 5, speed: 78, dmg: 3, coins: 5,  r: 11, body: '#6b3fa0', dark: '#3a1f5c', flies: true },
  ritter:   { name: 'Schwarzer Ritter', from: 7, weight: 3,  hp: 35, speed: 32, dmg: 10, coins: 15, r: 17, body: '#2b2d35', dark: '#0f1014' },
  rammbock: { name: 'Rammbock',        from: 6, weight: 1.5, hp: 45, speed: 20, dmg: 18, coins: 20, r: 22, body: '#8a5a2b', dark: '#3e2814', siege: 'ram' },
  katapult: { name: 'Katapult',        from: 8, weight: 1.2, hp: 30, speed: 22, dmg: 10, coins: 20, r: 20, body: '#9a6b3a', dark: '#4a3018', siege: 'cat' },
  zyklop:   { name: 'Zyklop',          from: 9, weight: 1.2, hp: 80, speed: 18, dmg: 18, coins: 30, r: 27, body: '#c08457', dark: '#7a4a22' },
};
const SQUAD_SIZE = 10;     // Kämpfer pro Haus
const SQUAD_KILLS = 20;    // nach so vielen Siegen verschwinden sie
const SQUAD_COLORS = ['#3b7dd8', '#9b4fc4', '#e0662f'];

const UPGRADES = [
  { id: 'wall',    ico: '🧱', nm: 'Dickere Mauern',   base: 10, mult: 1.35 },
  { id: 'arrow',   ico: '🏹', nm: 'Bessere Pfeile',   base: 12, mult: 1.4 },
  { id: 'speed',   ico: '⚡', nm: 'Schnellere Pfeile', base: 12, mult: 1.4 },
  { id: 'soldier', ico: '⚔️', nm: 'Stärkere Kämpfer', base: 15, mult: 1.4 },
  { id: 'bridge',  ico: '🌉', nm: 'Stärkere Zugbrücke', base: 15, mult: 1.4 },
  { id: 'fire',    ico: '🔥', nm: 'Feuerpfeile',      base: 25, mult: 1.5 },
  { id: 'tap',     ico: '👆', nm: 'Kräftiger Tipp',   base: 10, mult: 1.4 },
  { id: 'magnet',  ico: '🧲', nm: 'Münzmagnet',       base: 12, mult: 1.5 },
  { id: 'repair',  ico: '🔧', nm: 'Burg reparieren',  base: 6,  mult: 1.2 },
];

let S = null;            // Spielzustand
let phase = 'start';     // start | play | pause | over
let best = 0;
try { best = +localStorage.getItem('burg-best') || 0; } catch (e) {}

function newGame() {
  S = {
    coins: 0, wave: 0, hp: 100, maxHp: 100,
    arrowDmg: 1, arrowInterval: 1.6, soldierDmg: 1, soldierHp: 10,
    lv: { wall: 0, arrow: 0, speed: 0, soldier: 0, bridge: 0, fire: 0, tap: 0, magnet: 0, repair: 0 },
    enemies: [], arrows: [], stones: [], coinsOnGround: [], soldiers: [], fx: [], texts: [],
    queue: [], spawnCd: 0, betweenTimer: 2.5, inWave: false,
    towerCd: [0.5, 0.9, 1.3, 0.2],
    houses: [
      { x: 422, y: 325, active: false, kills: 0, toSpawn: 0, spawnCd: 0, id: 0 },
      { x: 500, y: 325, active: false, kills: 0, toSpawn: 0, spawnCd: 0, id: 1 },
      { x: 578, y: 325, active: false, kills: 0, toSpawn: 0, spawnCd: 0, id: 2 },
    ],
    banner: { text: 'Mach dich bereit!', t: 2.5 }, shake: 0, time: 0,
  };
}

// ====== Hilfsfunktionen ======
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function wallPoint(p) { return { x: clamp(p.x, WALL.l, WALL.r), y: clamp(p.y, WALL.t, WALL.b) }; }
// Prüft, ob die Strecke a->b durch die (vergrößerte) Burg geht
function crossesCastle(ax, ay, bx, by, m) {
  const l = WALL.l - m, r = WALL.r + m, t = WALL.t - m, b = WALL.b + m;
  let t0 = 0, t1 = 1; const dx = bx - ax, dy = by - ay;
  const p = [-dx, dx, -dy, dy], q = [ax - l, r - ax, ay - t, b - ay];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return false; continue; }
    const v = q[i] / p[i];
    if (p[i] < 0) { if (v > t1) return false; if (v > t0) t0 = v; }
    else { if (v < t0) return false; if (v < t1) t1 = v; }
  }
  return t0 < t1;
}
// Läuft um die Burg herum statt durch die Mauer
function walkAround(o, tx, ty, speed, dt) {
  if (!crossesCastle(o.x, o.y, tx, ty, MOAT.outer)) return moveTo(o, tx, ty, speed, dt);
  const m = MOAT.outer + 10;
  const corners = [[WALL.l - m, WALL.t - m], [WALL.r + m, WALL.t - m], [WALL.l - m, WALL.b + m], [WALL.r + m, WALL.b + m]];
  let best = null, bd = 1e9;
  for (const [cx, cy] of corners) {
    if (Math.hypot(cx - o.x, cy - o.y) < 3) continue;
    if (crossesCastle(o.x, o.y, cx, cy, MOAT.outer)) continue;
    const d = Math.hypot(cx - o.x, cy - o.y) + Math.hypot(tx - cx, ty - cy);
    if (d < bd) { bd = d; best = [cx, cy]; }
  }
  if (!best) return moveTo(o, tx, ty, speed, dt);
  moveTo(o, best[0], best[1], speed, dt);
  return false;
}
function inMoat(p) {
  const dx = Math.max(WALL.l - p.x, 0, p.x - WALL.r), dy = Math.max(WALL.t - p.y, 0, p.y - WALL.b);
  const d = Math.max(dx, dy);
  return d > MOAT.inner && d < MOAT.outer;
}
function moveTo(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 0.5) return true;
  const step = Math.min(d, speed * dt);
  o.x += dx / d * step; o.y += dy / d * step;
  o.dir = Math.atan2(dy, dx);
  return step >= d;
}
function addText(x, y, text, color) { S.texts.push({ x, y, text, color: color || '#fff', t: 0 }); }
function puff(x, y, color, n) {
  for (let i = 0; i < (n || 10); i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(30, 120);
    S.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.3, 0.6), color, r: rnd(2, 5) });
  }
}

// ====== Wellen ======
function startWave() {
  S.wave++;
  const n = S.wave;
  const q = [];
  const count = 5 + n * 4;
  // alle Gegnerarten, die ab dieser Welle dabei sind; Goblins werden später seltener
  const pool = Object.entries(ENEMY_TYPES).filter(([, T]) => n >= T.from)
    .map(([type, T]) => [type, type === 'goblin' ? Math.max(2, T.weight - n) : T.weight]);
  const total = pool.reduce((sum, [, w]) => sum + w, 0);
  // eine neue Gegnerart kommt in ihrer ersten Welle mindestens zweimal
  const fresh = pool.find(([type]) => ENEMY_TYPES[type].from === n && n > 1);
  for (let i = 0; i < count; i++) {
    let roll = Math.random() * total, type = pool[0][0];
    for (const [t, w] of pool) { if ((roll -= w) <= 0) { type = t; break; } }
    q.push(type);
  }
  if (fresh) { q[Math.floor(count / 3)] = fresh[0]; q[Math.floor(count * 2 / 3)] = fresh[0]; }
  S.queue = q;
  S.inWave = true;
  S.spawnCd = 0.5;
  S.banner = fresh ? { text: 'Welle ' + n + ': Neuer Gegner: ' + ENEMY_TYPES[fresh[0]].name + '!', t: 3 }
                   : { text: 'Welle ' + n, t: 2 };
}
function spawnEnemy(type) {
  const T = ENEMY_TYPES[type];
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = rnd(0, W); y = -25; }
  else if (side === 1) { x = W + 25; y = rnd(0, H); }
  else if (side === 2) { x = rnd(0, W); y = H + 25; }
  else { x = -25; y = rnd(0, H); }
  // Gegner werden mit jeder Welle zäher und schlagen härter zu
  const hp = Math.round(T.hp * (1 + 0.3 * (S.wave - 1) + 0.015 * (S.wave - 1) * (S.wave - 1)));
  const dmg = Math.round(T.dmg * (1 + 0.1 * (S.wave - 1)));
  S.enemies.push({ type, x, y, hp, maxHp: hp, speed: T.speed * rnd(0.9, 1.1) * (1 + Math.min(0.3, 0.01 * (S.wave - 1))), dmg, r: T.r,
    coins: T.coins, flies: !!T.flies, siege: T.siege || null, atkCd: 0.5, flash: 0, seed: Math.random() * 10, dir: 0, dead: false });
}

// ====== Schaden und Belohnung ======
function hitEnemy(e, dmg, house) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.12;
  if (e.hp <= 0) {
    e.dead = true;
    puff(e.x, e.y, ENEMY_TYPES[e.type].body, 12);
    for (let i = 0; i < e.coins; i++) {
      const a = rnd(0, Math.PI * 2), s = rnd(40, 110);
      S.coinsOnGround.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, fly: false });
    }
    if (house) {
      house.kills++;
      if (house.kills >= SQUAD_KILLS) newSquad(house, true);
    }
  }
}
function newSquad(house, retired) {
  for (const s of S.soldiers) if (s.house === house) { s.dead = true; puff(s.x, s.y, '#ffffff', 8); }
  if (retired) addText(house.x, house.y - 40, '20 besiegt! Neue Truppe!', '#ffe27a');
  house.kills = 0;
  house.toSpawn = SQUAD_SIZE;
  house.spawnCd = 0.3;
}
function collectCoin(c) {
  if (c.fly) return;
  c.fly = true;
}

// ====== Upgrades ======
function upgradeCost(u) { return Math.round(u.base * Math.pow(u.mult, S.lv[u.id])); }
function buy(id) {
  if (phase !== 'play') return;
  const u = UPGRADES.find(x => x.id === id);
  const cost = upgradeCost(u);
  if (S.coins < cost) return;
  if (id === 'repair' && S.hp >= S.maxHp) return;
  S.coins -= cost; S.lv[id]++;
  const lvNow = S.lv[id];
  if (id !== 'repair' && (lvNow === 4 || lvNow === 10 || lvNow === 15)) {
    // Extra-Kraft beim Aufstieg in eine neue Look-Stufe
    const t = tier(lvNow), bonus = t === 1 ? 1 : t === 2 ? 3 : 6;
    if (id === 'wall') { S.maxHp += 50 * bonus; S.hp += 50 * bonus; }
    if (id === 'arrow') S.arrowDmg += bonus;
    if (id === 'speed') S.arrowInterval *= 0.85;
    if (id === 'soldier') { S.soldierDmg += bonus; S.soldierHp += 10 * bonus; }
    S.banner = { text: '⭐ ' + TIER_NAMES[t] + '-Stufe: ' + UPGRADES.find(x => x.id === id).nm + '! ⭐', t: 3 };
    puff(500, 350, t === 2 ? '#9fe8ff' : t === 3 ? '#d38cff' : '#ffe27a', 40);
  }
  if (id === 'wall') { S.maxHp += 25; S.hp += 25; for (const [x, y] of TOWERS) puff(x, y, '#d8d8d8', 8); addText(500, 200, 'Mauern stärker!', '#ffe27a'); }
  if (id === 'arrow') { S.arrowDmg += 1; for (const [x, y] of TOWERS) puff(x, y - towerH(), '#ffe27a', 8); addText(500, 200, 'Pfeile stärker!', '#ffe27a'); }
  if (id === 'speed') { S.arrowInterval *= 0.8; addText(500, 200, 'Pfeile schneller!', '#ffe27a'); }
  if (id === 'soldier') {
    S.soldierDmg += 1; S.soldierHp += 5;
    for (const s of S.soldiers) { s.maxHp = S.soldierHp; s.hp += 5; s.r = 12 * knightScale(); puff(s.x, s.y, '#ffe27a', 6); }
    addText(500, 200, 'Kämpfer stärker!', '#ffe27a');
  }
  if (id === 'bridge') { puff(GATE.x, GATE.y + 30, '#ffe27a', 14); addText(500, 200, S.lv.bridge === 2 ? 'Stacheln am Tor!' : 'Zugbrücke stärker!', '#ffe27a'); }
  if (id === 'fire') { for (const [x, y] of TOWERS) puff(x, y - towerH(), '#ff8a2a', 10); addText(500, 200, 'Feuerpfeile!', '#ffb36b'); }
  if (id === 'tap') addText(500, 200, 'Dein Tipp haut stärker zu!', '#ffe27a');
  if (id === 'magnet') addText(500, 200, 'Münzen kommen schneller!', '#ffe27a');
  if (id === 'repair') { S.hp = Math.min(S.maxHp, S.hp + 30); puff(500, 350, '#d8d8d8', 16); addText(500, 200, 'Repariert!', '#9cff8a'); }
  renderBar();
}

// ====== Update ======
function update(dt) {
  S.time += dt;
  // Zugbrücke: geht runter, wenn Kämpfer rausgehen, und danach wieder hoch
  const needBridge = S.soldiers.some(s => s.path.length) || S.houses.some(h => h.active && h.toSpawn > 0);
  if (needBridge) S.bridgeHold = 1.2; else S.bridgeHold = Math.max(0, (S.bridgeHold || 0) - dt);
  const want = S.bridgeHold > 0 ? 1 : 0;
  S.bridge = clamp((S.bridge || 0) + (want ? 1.6 : -1.0) * (1 + 0.3 * Math.min(S.lv.bridge, 5)) * dt, 0, 1);
  if (S.banner && phase !== 'start') { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  S.shake = Math.max(0, S.shake - dt);

  // Wellensteuerung
  if (!S.inWave) {
    S.betweenTimer -= dt;
    if (S.betweenTimer <= 0) startWave();
  } else {
    if (S.queue.length) {
      S.spawnCd -= dt;
      if (S.spawnCd <= 0) {
        spawnEnemy(S.queue.shift());
        S.spawnCd = Math.max(0.35, 1.3 - 0.06 * S.wave) * rnd(0.6, 1.3);
      }
    } else if (S.enemies.length === 0) {
      S.inWave = false;
      S.betweenTimer = 5;
      const bonus = 5 + S.wave * 4;
      S.coins += bonus;
      S.banner = { text: 'Welle geschafft! +' + bonus + ' Münzen', t: 3 };
    }
  }

  // Häuser schicken Kämpfer
  for (const h of S.houses) {
    if (!h.active) continue;
    if (h.toSpawn > 0) {
      h.spawnCd -= dt;
      if (h.spawnCd <= 0) {
        h.toSpawn--; h.spawnCd = 0.25;
        const idx = SQUAD_SIZE - 1 - h.toSpawn;
        S.soldiers.push({ house: h, x: h.x, y: h.y + 18, r: 12 * knightScale(), hp: S.soldierHp, maxHp: S.soldierHp,
          path: [{ x: h.x, y: 445 }, { x: GATE.x + rnd(-10, 10), y: GATE.y + 2 }, { x: GATE.x + rnd(-8, 8), y: GATE.y + 40 }, { x: GATE.x + rnd(-14, 14), y: GATE.y + MOAT.outer + 18 }],
          atkCd: 0, swing: 0, dir: Math.PI / 2, idx, dead: false });
      }
    } else if (!S.soldiers.some(s => s.house === h && !s.dead)) {
      addText(h.x, h.y - 40, 'Neue Truppe!', '#ffe27a');
      newSquad(h, false);
    }
  }

  // Kämpfer
  for (const s of S.soldiers) {
    if (s.dead) continue;
    s.swing = Math.max(0, s.swing - dt);
    if (s.path.length) {
      if (s.path.length <= 2 && S.bridge < 0.98) continue;   // warten, bis die Brücke unten ist
      if (moveTo(s, s.path[0].x, s.path[0].y, 80, dt)) s.path.shift();
      continue;
    }
    let target = null, bd = 1e9;
    for (const e of S.enemies) { if (e.dead) continue; const d = dist(s, e); if (d < bd) { bd = d; target = e; } }
    if (target) {
      if (bd > s.r + target.r + 3) walkAround(s, target.x, target.y, 75, dt);
      else {
        s.dir = Math.atan2(target.y - s.y, target.x - s.x);
        s.atkCd -= dt;
        if (s.atkCd <= 0) { s.atkCd = 0.6; s.swing = 0.2; hitEnemy(target, S.soldierDmg, s.house); }
      }
    } else {
      // Wache vor dem Tor
      const gx = GATE.x + (s.idx - 4.5) * 26;
      const gy = GATE.y + MOAT.outer + 34 + s.house.id * 30;
      walkAround(s, gx, gy, 60, dt);
    }
    // nicht durch die Mauer laufen
    const m = 14;
    if (s.x > WALL.l - m && s.x < WALL.r + m && s.y > WALL.t - m && s.y < WALL.b + m) {
      const pl = s.x - (WALL.l - m), pr = (WALL.r + m) - s.x, pt = s.y - (WALL.t - m), pb = (WALL.b + m) - s.y;
      const mn = Math.min(pl, pr, pt, pb);
      if (mn === pl) s.x = WALL.l - m; else if (mn === pr) s.x = WALL.r + m;
      else if (mn === pt) s.y = WALL.t - m; else s.y = WALL.b + m;
    }
    if (s.hp <= 0) { s.dead = true; puff(s.x, s.y, SQUAD_COLORS[s.house.id], 8); }
  }

  // Gegner
  for (const e of S.enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.throwAnim = Math.max(0, (e.throwAnim || 0) - dt);
    if (e.siege === 'cat') {
      // Katapult: bleibt in sicherem Abstand stehen und schleudert Steine auf die Mauer
      const wp = wallPoint(e), dw = dist(e, wp);
      e.dir = Math.atan2(wp.y - e.y, wp.x - e.x);
      if (dw > 230) { e.attacking = false; moveTo(e, wp.x, wp.y, inMoat(e) ? e.speed * 0.45 : e.speed, dt); e.dir = Math.atan2(wp.y - e.y, wp.x - e.x); }
      else {
        e.attacking = true;
        e.atkCd -= dt;
        if (e.atkCd <= 0) {
          e.atkCd = 3.2; e.throwAnim = 0.5;
          S.stones.push({ sx: e.x, sy: e.y - 10, tx: wp.x + rnd(-10, 10), ty: wp.y + rnd(-10, 10), x: e.x, y: e.y, h: 0, t: 0, dur: 1.3, dmg: e.dmg });
        }
      }
      continue;
    }
    // Kämpfer in der Nähe? (Ein Rammbock lässt sich nicht aufhalten.)
    let foe = null, fd = 1e9;
    if (e.siege !== 'ram')
      for (const s of S.soldiers) { if (s.dead || s.path.length) continue; const d = dist(e, s); if (d < fd) { fd = d; foe = s; } }
    if (foe && fd < e.r + foe.r + 4) {
      e.dir = Math.atan2(foe.y - e.y, foe.x - e.x);
      e.atkCd -= dt;
      if (e.atkCd <= 0) { e.atkCd = 1; foe.hp -= e.dmg; }
      e.attacking = true;
      continue;
    }
    const wp = wallPoint(e);
    const dw = dist(e, wp);
    if (dw <= e.r + 6 + (wallThick() - 16) / 2) {
      e.attacking = true;
      e.dir = Math.atan2(wp.y - e.y, wp.x - e.x);
      e.atkCd -= dt;
      if (e.atkCd <= 0) {
        e.atkCd = e.siege === 'ram' ? 2.2 : 1;
        if (e.siege === 'ram') { e.throwAnim = 0.5; S.shake = 0.35; addText(wp.x, wp.y - 20, 'RUMMS!', '#ffb36b'); }
        S.hp -= e.dmg; S.shake = Math.max(S.shake, 0.15);
        puff(wp.x, wp.y, '#b0a090', 4);
      }
    } else {
      e.attacking = false;
      e.swim = !e.flies && !e.siege && inMoat(e);   // Fledermäuse fliegen einfach drüber
      const sp = (e.swim || (e.siege && inMoat(e))) ? e.speed * 0.45 : e.speed;   // im Wasser schwimmen sie langsamer
      if (foe && fd < 70) moveTo(e, foe.x, foe.y, sp, dt);
      else moveTo(e, wp.x, wp.y, sp, dt);
    }
  }
  // Stacheln am Tor (ab Stufe 2 "Stärkere Zugbrücke")
  if (S.lv.bridge >= 2) {
    const gp = { x: GATE.x, y: GATE.y + wallThick() / 2 + 10 };
    for (const e of S.enemies) {
      if (e.dead || e.flies || dist(e, gp) > 70 + e.r) continue;
      e.spike = (e.spike || 0) + dt;
      if (e.spike >= 0.5) { e.spike = 0; hitEnemy(e, S.lv.bridge - 1, null); puff(e.x, e.y, '#cccccc', 3); }
    }
  }
  // Gegner schubsen sich auseinander
  const en = S.enemies;
  for (let i = 0; i < en.length; i++) for (let j = i + 1; j < en.length; j++) {
    const a = en[i], b = en[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d > 0 && d < min) { const p = (min - d) / 2; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; }
  }

  const so = S.soldiers;
  for (let i = 0; i < so.length; i++) for (let j = i + 1; j < so.length; j++) {
    const a = so[i], b = so[j];
    if (a.path.length || b.path.length) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d > 0 && d < min) { const p = (min - d) / 2; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; }
  }

  // Türme schießen
  for (let i = 0; i < 4; i++) {
    S.towerCd[i] -= dt;
    if (S.towerCd[i] > 0) continue;
    const t = { x: TOWERS[i][0], y: TOWERS[i][1] };
    let target = null, bd = 300;
    for (const e of S.enemies) { if (e.dead) continue; const d = dist(t, e); if (d < bd) { bd = d; target = e; } }
    if (target) {
      S.arrows.push({ x: t.x, y: t.y - towerH() - 4, target, dir: 0 });
      S.towerCd[i] = S.arrowInterval;
    }
  }
  for (const a of S.arrows) {
    if (a.target.dead) { a.done = true; continue; }
    if (moveTo(a, a.target.x, a.target.y, 480, dt) || dist(a, a.target) < a.target.r) {
      a.done = true;
      const tx = a.target.x, ty = a.target.y;
      hitEnemy(a.target, S.arrowDmg, null);
      if (S.lv.fire > 0) {
        puff(tx, ty, '#ff8a2a', 6);
        for (const e of S.enemies) if (e !== a.target && !e.dead && Math.hypot(e.x - tx, e.y - ty) < 30 + S.lv.fire * 8) hitEnemy(e, S.lv.fire, null);
      }
    }
  }

  // Münzen
  for (const c of S.coinsOnGround) {
    c.t += dt;
    if (c.fly) {
      if (moveTo(c, HUD_COIN.x, HUD_COIN.y, 900, dt)) { c.done = true; S.coins++; renderBar(); }
    } else {
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.9; c.vy *= 0.9;
      if (c.t > Math.max(0.3, 7 - S.lv.magnet * 1.5)) collectCoin(c);   // fliegen von selbst ins Säckchen, mit Münzmagnet schneller
    }
  }

  // Effekte
  for (const f of S.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; }
  for (const t of S.texts) { t.t += dt; t.y -= 30 * dt; }

  S.enemies = S.enemies.filter(e => !e.dead);
  S.soldiers = S.soldiers.filter(s => !s.dead);
  for (const st of S.stones) {
    st.t += dt;
    const k = Math.min(1, st.t / st.dur);
    st.x = st.sx + (st.tx - st.sx) * k; st.y = st.sy + (st.ty - st.sy) * k;
    st.h = Math.sin(k * Math.PI) * 120;          // Flugbogen
    if (k >= 1) {
      st.done = true; S.hp -= st.dmg; S.shake = 0.3;
      puff(st.tx, st.ty, '#8d8d8d', 14); addText(st.tx, st.ty - 20, 'BUMM!', '#ffb36b');
    }
  }
  S.stones = S.stones.filter(st => !st.done);
  S.arrows = S.arrows.filter(a => !a.done);
  S.coinsOnGround = S.coinsOnGround.filter(c => !c.done);
  S.fx = S.fx.filter(f => f.t < f.life);
  S.texts = S.texts.filter(t => t.t < 1.4);

  if (S.hp <= 0) gameOver();
}

// ====== Tippen / Klicken ======
function onTap(x, y) {
  if (phase !== 'play') return;
  S.fx.push({ x, y, vx: 0, vy: 0, t: 0, life: 0.25, ring: true });
  // Münzen einsammeln
  let got = false;
  for (const c of S.coinsOnGround) if (!c.fly && Math.hypot(c.x - x, c.y - y) < 40) { collectCoin(c); got = true; }
  if (got) return;
  // Gegner hauen
  let target = null, bd = 1e9;
  for (const e of S.enemies) { const d = Math.hypot(e.x - x, e.y - y); if (d < e.r + 16 && d < bd) { bd = d; target = e; } }
  if (target) { hitEnemy(target, 1 + S.lv.tap, null); puff(x, y, S.lv.tap ? '#ffe27a' : '#ffffff', 5 + S.lv.tap * 2); return; }
  // Haus antippen
  for (const h of S.houses) {
    if (!h.active && Math.abs(x - h.x) < 36 && Math.abs(y - h.y) < 36) {
      h.active = true; newSquad(h, false);
      addText(h.x, h.y - 40, 'Los gehts!', '#ffe27a');
    }
  }
}

// ====== Zeichnen ======
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
const bg = document.createElement('canvas');
function buildBackground() {
  bg.width = W * 2; bg.height = H * 2;
  const g = bg.getContext('2d');
  g.scale(2, 2);
  g.fillStyle = '#5c9e45'; g.fillRect(0, 0, W, H);
  // Flecken
  for (let i = 0; i < 40; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(80,140,60,.5)' : 'rgba(110,170,80,.45)';
    g.beginPath(); g.ellipse(rnd(0, W), rnd(0, H), rnd(30, 90), rnd(20, 60), rnd(0, 3), 0, Math.PI * 2); g.fill();
  }
  // Grashalme
  g.strokeStyle = 'rgba(40,90,30,.55)'; g.lineWidth = 1.5;
  for (let i = 0; i < 380; i++) {
    const x = rnd(0, W), y = rnd(0, H);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 6); g.moveTo(x, y); g.lineTo(x + 2, y - 7); g.stroke();
  }
  // Blumen
  for (let i = 0; i < 45; i++) {
    g.fillStyle = ['#fff', '#ffe066', '#ff8fb1'][i % 3];
    g.beginPath(); g.arc(rnd(0, W), rnd(0, H), 2.2, 0, Math.PI * 2); g.fill();
  }
}

function resize() {
  const stage = document.getElementById('stage');
  const aw = stage.clientWidth - 16, ah = stage.clientHeight - 16;
  scale = Math.min(aw / W, ah / H);
  dpr = window.devicePixelRatio || 1;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}

function drawMoat() {
  const o = MOAT.outer, i = MOAT.inner;
  // Uferrand
  ctx.fillStyle = '#8a7346';
  roundRect(WALL.l - o - 4, WALL.t - o - 4, WALL.r - WALL.l + 2 * o + 8, WALL.b - WALL.t + 2 * o + 8, 34); ctx.fill();
  // Wasser
  const g = ctx.createLinearGradient(0, WALL.t - o, 0, WALL.b + o);
  g.addColorStop(0, '#3f9be0'); g.addColorStop(1, '#2a74b8');
  ctx.fillStyle = g;
  roundRect(WALL.l - o, WALL.t - o, WALL.r - WALL.l + 2 * o, WALL.b - WALL.t + 2 * o, 30); ctx.fill();
  // Insel mit der Burg
  ctx.fillStyle = '#7c6a44';
  roundRect(WALL.l - i - 3, WALL.t - i - 3, WALL.r - WALL.l + 2 * i + 6, WALL.b - WALL.t + 2 * i + 6, 16); ctx.fill();
  ctx.fillStyle = '#6aa84f';
  roundRect(WALL.l - i, WALL.t - i, WALL.r - WALL.l + 2 * i, WALL.b - WALL.t + 2 * i, 14); ctx.fill();
  // Wellen
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const mid = (i + o) / 2;
  for (let k = 0; k < 28; k++) {
    const t = (k / 28 + S.time * 0.01) % 1;
    const per = 2 * (WALL.r - WALL.l + 2 * mid) + 2 * (WALL.b - WALL.t + 2 * mid);
    let d = t * per, x, y;
    const w = WALL.r - WALL.l + 2 * mid, h = WALL.b - WALL.t + 2 * mid;
    if (d < w) { x = WALL.l - mid + d; y = WALL.t - mid; }
    else if ((d -= w) < h) { x = WALL.r + mid; y = WALL.t - mid + d; }
    else if ((d -= h) < w) { x = WALL.r + mid - d; y = WALL.b + mid; }
    else { d -= w; x = WALL.l - mid; y = WALL.b + mid - d; }
    const off = Math.sin(S.time * 2 + k * 1.7) * 8;
    ctx.beginPath(); ctx.arc(x + off * 0.5, y + off * 0.3, 5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
}
function drawBridge() {
  const bl = Math.min(S.lv.bridge, 5);
  const len = (BRIDGE_LEN - (wallThick() - 16) / 2) * (0.12 + 0.88 * S.bridge);   // hochgezogen sieht man sie verkürzt
  const w = 44 + bl * 4, x0 = GATE.x - w / 2, y0 = GATE.y + wallThick() / 2 + 3;
  // Schatten aufs Wasser
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x0 + 4, y0 + 4, w, len);
  // Bretter
  ctx.fillStyle = S.bridge > 0.5 ? '#9b6a37' : '#7d522a';
  ctx.fillRect(x0, y0, w, len);
  ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 1.5;
  for (let y = y0 + 7; y < y0 + len; y += 7) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke(); }
  ctx.strokeRect(x0, y0, w, len);
  // Stufe 1+: Eisenbeschläge an den Seiten
  if (bl >= 1) {
    const iron = S.lv.bridge >= 10 ? '#5fd0ff' : bl >= 4 ? '#e0a810' : '#4b4f57';
    ctx.fillStyle = iron;
    ctx.fillRect(x0, y0, 5, len); ctx.fillRect(x0 + w - 5, y0, 5, len);
    for (let y = y0 + 10; y < y0 + len - 4; y += 14) ctx.fillRect(x0, y, w, 3);
    // Nieten
    ctx.fillStyle = bl >= 3 ? '#ffe27a' : '#9aa0a8';
    for (let y = y0 + 6; y < y0 + len - 2; y += 14) for (const xx of [x0 + 2.5, x0 + w - 2.5]) { ctx.beginPath(); ctx.arc(xx, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
  }
  // Ketten von der Mauer zum Brückenende (ab Stufe 3 dicker, ab Stufe 4 golden)
  ctx.strokeStyle = S.lv.bridge >= 10 ? '#9fe8ff' : bl >= 4 ? '#ffcf3f' : '#3a3a3a'; ctx.lineWidth = bl >= 3 ? 3.5 : 2; ctx.setLineDash([4, 3]);
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(GATE.x + sx * (30 + bl * 2), GATE.y - 4); ctx.lineTo(GATE.x + sx * (w / 2 - 1), y0 + len - 2); ctx.stroke();
  }
  ctx.setLineDash([]);
  // Stufe 2+: Stacheln links und rechts vom Tor
  if (bl >= 2) {
    ctx.fillStyle = S.lv.bridge >= 10 ? '#c8f4ff' : bl >= 4 ? '#ffd966' : '#c9ced6'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    const sy = y0 - 1, n = 2 + bl;
    for (const sd of [-1, 1]) for (let k = 0; k < n; k++) {
      const sx = GATE.x + sd * (w / 2 + 6 + k * 9);
      ctx.beginPath(); ctx.moveTo(sx - 4, sy); ctx.lineTo(sx, sy + 12 + bl); ctx.lineTo(sx + 4, sy); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
}
function drawCastle() {
  drawMoat();
  // Hof
  ctx.fillStyle = '#d8c08a';
  ctx.fillRect(WALL.l, WALL.t, WALL.r - WALL.l, WALL.b - WALL.t);
  ctx.fillStyle = 'rgba(160,130,80,.35)';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(400 + i * 40, 420 + (i % 2) * 18, 7, 0, Math.PI * 2); ctx.fill(); }
  // Weg zum Tor
  ctx.fillStyle = '#c4a56c';
  ctx.fillRect(GATE.x - 18, 360, 36, WALL.b - 360);

  // Mauern
  // Mauern: jede Stufe "Dickere Mauern" macht sie dicker
  const wt = wallThick(), hw = wt / 2;
  ctx.lineJoin = 'miter';
  ctx.strokeStyle = '#6f6f6f'; ctx.lineWidth = wt + 6;
  ctx.strokeRect(WALL.l, WALL.t, WALL.r - WALL.l, WALL.b - WALL.t);
  const wT = tier(S.lv.wall);
  if (wT >= 3) { ctx.shadowColor = '#c77dff'; ctx.shadowBlur = 10 + pulse(3) * 12; }
  ctx.strokeStyle = ['#9d9d9d', '#a7acb4', '#8fc3dc', '#7b6aa8'][wT]; ctx.lineWidth = wt;
  ctx.strokeRect(WALL.l, WALL.t, WALL.r - WALL.l, WALL.b - WALL.t);
  ctx.shadowBlur = 0;
  // Steinfugen ab Stufe 1
  if (S.lv.wall >= 1) {
    ctx.strokeStyle = 'rgba(70,70,70,.45)'; ctx.lineWidth = 1.2;
    const rows = Math.floor(wt / 8);
    for (let row = 1; row < rows; row++) {
      const o = -hw + row * (wt / rows);
      ctx.beginPath();
      ctx.moveTo(WALL.l + o, WALL.t + o); ctx.lineTo(WALL.r - o, WALL.t + o); ctx.lineTo(WALL.r - o, WALL.b - o);
      ctx.lineTo(WALL.l + o, WALL.b - o); ctx.closePath(); ctx.stroke();
    }
    ctx.beginPath();
    for (let x = WALL.l + 8; x < WALL.r - 4; x += 14) {
      ctx.moveTo(x, WALL.t - hw); ctx.lineTo(x, WALL.t + hw); ctx.moveTo(x + 7, WALL.b - hw); ctx.lineTo(x + 7, WALL.b + hw);
    }
    for (let y = WALL.t + 8; y < WALL.b - 4; y += 14) {
      ctx.moveTo(WALL.l - hw, y); ctx.lineTo(WALL.l + hw, y); ctx.moveTo(WALL.r - hw, y + 7); ctx.lineTo(WALL.r + hw, y + 7);
    }
    ctx.stroke();
  }
  // Zinnen (werden mit der Mauer größer)
  ctx.fillStyle = ['#b8b8b8', '#c9ccd2', '#c8f4ff', '#e3c8ff'][wT];
  const zl = 10 + Math.min(S.lv.wall, 6), zd = 6 + Math.min(S.lv.wall, 6);
  for (let x = WALL.l + 30; x < WALL.r - 20; x += 22) { ctx.fillRect(x, WALL.t - hw - 3, zl, zd); ctx.fillRect(x, WALL.b + hw + 3 - zd, zl, zd); }
  for (let y = WALL.t + 30; y < WALL.b - 20; y += 22) { ctx.fillRect(WALL.l - hw - 3, y, zd, zl); ctx.fillRect(WALL.r + hw + 3 - zd, y, zd, zl); }

  if (wT >= 2) {
    // funkelnde Kristalle (Diamant) bzw. leuchtende Runen (Magie) auf der Mauer
    const pts = [];
    for (let x = WALL.l + 40; x < WALL.r - 30; x += 44) pts.push([x, WALL.t], [x + 22, WALL.b]);
    for (let y = WALL.t + 40; y < WALL.b - 30; y += 44) pts.push([WALL.l, y], [WALL.r, y + 22]);
    pts.forEach(([x, y], k) => {
      const tw = 0.5 + 0.5 * Math.sin(S.time * 3 + k);
      ctx.fillStyle = wT >= 3 ? 'rgba(211,140,255,' + (0.5 + tw * 0.5) + ')' : 'rgba(159,232,255,' + (0.5 + tw * 0.5) + ')';
      ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 4, y); ctx.closePath(); ctx.fill();
    });
  }
  // Tor
  ctx.fillStyle = '#7a4a22';
  const gh = hw + 4;
  ctx.fillRect(GATE.x - GATE.w / 2, GATE.y - gh, GATE.w, gh * 2);
  ctx.strokeStyle = '#4e2e12'; ctx.lineWidth = 2;
  for (let i = 1; i < 5; i++) { const x = GATE.x - GATE.w / 2 + i * GATE.w / 5; ctx.beginPath(); ctx.moveTo(x, GATE.y - gh); ctx.lineTo(x, GATE.y + gh); ctx.stroke(); }
  ctx.strokeRect(GATE.x - GATE.w / 2, GATE.y - gh, GATE.w, gh * 2);
  drawBridge();

  // Türme
  // Türme: "Bessere Pfeile" macht sie höher, "Schnellere Pfeile" bringt mehr Bogenschützen
  const th = towerH();
  TOWERS.forEach(([x, y0], i) => {
    const R = 30 + th * 0.25;
    const y = y0 - th;   // Turmspitze
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x + 5 + th * 0.4, y0 + 6, R, R * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    if (th > 0) {
      // Turmwand
      ctx.fillStyle = '#6e6e6e';
      ctx.fillRect(x - R, y, R * 2, th);
      ctx.beginPath(); ctx.arc(x, y0, R, 0, Math.PI); ctx.fill();
      ctx.strokeStyle = 'rgba(40,40,40,.4)'; ctx.lineWidth = 1.2;
      for (let yy = y + 6; yy < y0 + R * 0.8; yy += 6) {
        const half = yy <= y0 ? R : Math.sqrt(Math.max(0, R * R - (yy - y0) * (yy - y0)));
        ctx.beginPath(); ctx.moveTo(x - half, yy); ctx.lineTo(x + half, yy); ctx.stroke();
      }
      // Schießscharten
      ctx.fillStyle = '#2b2b2b';
      const slits = Math.min(3, Math.ceil(th / 12));
      for (let k = 0; k < slits; k++) ctx.fillRect(x - 2 + (k - (slits - 1) / 2) * 14, y0 + 6, 4, 10);
    }
    const aT = tier(S.lv.arrow);
    if (aT >= 2) { ctx.shadowColor = aT >= 3 ? '#c77dff' : '#7fdcff'; ctx.shadowBlur = 8 + pulse(3) * 10; }
    ctx.fillStyle = ['#8f8f8f', '#8f8f8f', '#7fa9bf', '#6f5f9a'][aT]; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5c5c5c'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = ['#b5b5b5', '#d8c27a', '#c8f4ff', '#e3c8ff'][aT];
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; ctx.beginPath(); ctx.arc(x + Math.cos(a) * (R - 6), y + Math.sin(a) * (R - 6), 5, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#7a7a7a'; ctx.beginPath(); ctx.arc(x, y, R * 0.55, 0, Math.PI * 2); ctx.fill();
    if (aT >= 3) {

// Look-Stufen: 1 = Gold (ab Stufe 4), 2 = Diamant (ab Stufe 10), 3 = Magie (ab Stufe 15)
function tier(lv) { return lv >= 15 ? 3 : lv >= 10 ? 2 : lv >= 4 ? 1 : 0; }
const TIER_NAMES = ['', 'Gold', 'Diamant', 'Magie'];
function pulse(speed) { return 0.5 + 0.5 * Math.sin(S.time * (speed || 4)); }
// Wie die Upgrades aussehen (Stufen werden gedeckelt, damit nichts riesig wird)
function wallThick() { return 16 + Math.min(S.lv.wall, 6) * 4; }
function towerH() { return Math.min(S.lv.arrow, 6) * 6; }
function knightScale() { return 1 + Math.min(S.lv.soldier, 6) * 0.1; }
const SQUAD_DARK = ['#1f4f99', '#5e2b80', '#9a3a14'];
function drawSoldier(s) {
  const col = SQUAD_COLORS[s.house.id], dark = SQUAD_DARK[s.house.id];
  const moving = s.lx !== undefined && Math.hypot(s.x - s.lx, s.y - s.ly) > 0.05;
  s.lx = s.x; s.ly = s.y;
  const t = S.time * 12 + s.idx;
  const bob = moving ? Math.abs(Math.sin(t)) * -2 : 0;
  const flip = Math.cos(s.dir) < 0 ? -1 : 1;
  ctx.save(); ctx.translate(s.x, s.y);

  const ks = knightScale();
  ctx.scale(ks, ks);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(1, 10, 10, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  if (S.lv.soldier >= 15) {
    ctx.strokeStyle = 'rgba(199,125,255,' + (0.4 + pulse(4) * 0.4) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 9, 14 + pulse(4) * 3, 5 + pulse(4), 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.translate(0, bob);

  // Umhang (weht nach hinten)
  ctx.save(); ctx.scale(flip, 1);
  const wave = Math.sin(S.time * 8 + s.idx) * 2 + (moving ? -3 : 0);
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(6, -4);
  ctx.quadraticCurveTo(10 + wave * 0.3, 6, 8 + wave, 13);
  ctx.lineTo(3 + wave, 11); ctx.lineTo(-1 + wave, 14); ctx.lineTo(-5 + wave, 11); ctx.lineTo(-10 + wave, 13);
  ctx.quadraticCurveTo(-10, 4, -6, -4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Schwert (mit Schwung-Spur beim Zuschlagen)
  const sa = s.dir + (s.swing > 0 ? -1.1 + (0.2 - s.swing) * 11 : 0.6);
  if (s.swing > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (s.swing * 4) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 21, sa - 1.3, sa); ctx.stroke();

  ctx.strokeStyle = '#ffcf3f'; ctx.lineWidth = 3;   // Parierstange
  ctx.beginPath(); ctx.moveTo(cx * 9 - cy * 5, cy * 9 + cx * 5); ctx.lineTo(cx * 9 + cy * 5, cy * 9 - cx * 5); ctx.stroke();
  const kTs = tier(S.lv.soldier), blade = 25 + (kTs >= 2 ? 4 : 0) + (kTs >= 3 ? 4 : 0);
  if (kTs >= 2) { ctx.shadowColor = kTs >= 3 ? '#c77dff' : '#4fd2ff'; ctx.shadowBlur = 10; }
  ctx.strokeStyle = kTs >= 3 ? '#f1dcff' : kTs === 2 ? '#c8f4ff' : '#eef2f6'; ctx.lineWidth = 3.5 + (kTs >= 2 ? 1 : 0);  // Klinge
  ctx.beginPath(); ctx.moveTo(cx * 10, cy * 10); ctx.lineTo(cx * blade, cy * blade); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#9aa6b2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx * 11, cy * 11); ctx.lineTo(cx * 23, cy * 23); ctx.stroke();

  const kT = tier(S.lv.soldier);

function drawHUD() {

function draw() {

    if (sl > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = aw + 1;
      ctx.beginPath(); ctx.moveTo(a.x - cx * alen, a.y - cy * alen); ctx.lineTo(a.x - cx * (alen + sl * 7), a.y - cy * (alen + sl * 7)); ctx.stroke();
    }
    if (aT >= 3) {
      // Regenbogen-Schweif
      for (let k = 0; k < 5; k++) {
        ctx.strokeStyle = 'hsla(' + ((S.time * 300 + k * 60) % 360) + ',90%,65%,' + (0.5 - k * 0.08) + ')'; ctx.lineWidth = aw;
        ctx.beginPath(); ctx.moveTo(a.x - cx * (alen + k * 6), a.y - cy * (alen + k * 6)); ctx.lineTo(a.x - cx * (alen + k * 6 + 6), a.y - cy * (alen + k * 6 + 6)); ctx.stroke();
      }
    }
    if (aT >= 1) {
      ctx.strokeStyle = glow; ctx.lineWidth = aw + 5 + (aT >= 2 ? 3 : 0);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x - cx * alen, a.y - cy * alen); ctx.stroke();
    }
    ctx.strokeStyle = shaft; ctx.lineWidth = aw;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x - cx * alen, a.y - cy * alen); ctx.stroke();
    // Spitze
    const ts = 3 + aw;
    ctx.fillStyle = tip; ctx.beginPath();
    ctx.moveTo(a.x + cx * ts, a.y + cy * ts); ctx.lineTo(a.x - cy * ts * 0.6, a.y + cx * ts * 0.6); ctx.lineTo(a.x + cy * ts * 0.6, a.y - cx * ts * 0.6); ctx.closePath(); ctx.fill();
    if (S.lv.fire > 0) {
      const fl = 4 + Math.min(S.lv.fire, 4) * 1.5 + Math.sin(S.time * 30 + a.x) * 1.5;
      ctx.fillStyle = S.lv.fire >= 10 ? 'rgba(60,140,255,.75)' : 'rgba(255,120,30,.75)'; ctx.beginPath(); ctx.arc(a.x, a.y, fl, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = S.lv.fire >= 10 ? 'rgba(220,245,255,.95)' : 'rgba(255,230,90,.9)'; ctx.beginPath(); ctx.arc(a.x, a.y, fl * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    // Federn
    ctx.strokeStyle = aT >= 1 ? '#ffffff' : '#d63b2f'; ctx.lineWidth = 1.5;
    const ex = a.x - cx * alen, ey = a.y - cy * alen;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - cx * 4 - cy * 3, ey - cy * 4 + cx * 3); ctx.moveTo(ex, ey); ctx.lineTo(ex - cx * 4 + cy * 3, ey - cy * 4 - cx * 3); ctx.stroke();
  }
  // Effekte
  for (const f of S.fx) {
    const k = 1 - f.t / f.life;
    if (f.ring) {
      ctx.strokeStyle = 'rgba(255,255,255,' + k + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 10 + (1 - k) * 22, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = k; ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  // Katapult-Steine
  for (const st of S.stones) {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(st.x, st.y, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
    blob(st.x, st.y - st.h, 7, 7, '#8d8d8d', '#555', 1.5);
    ctx.fillStyle = '#a8a8a8'; ctx.beginPath(); ctx.arc(st.x - 2, st.y - st.h - 2, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const c of S.coinsOnGround) if (c.fly) drawCoin(c.x, c.y, 9);
  for (const t of S.texts) {
    ctx.globalAlpha = Math.min(1, 1.4 - t.t);
    ctx.font = '700 20px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawHUD();
}

// ====== Upgrade-Leiste ======
const bar = document.getElementById('bar');
// Die Knöpfe werden nur einmal gebaut und danach nur aktualisiert,
// damit ein Tipp nie auf einen gerade ersetzten Knopf fällt.
const barButtons = {};
function buildBar() {
  for (const u of UPGRADES) {
    const b = document.createElement('button');
    b.className = 'up';
    b.innerHTML = '<span class="ico">' + u.ico + '</span><span class="nm">' + u.nm + '</span>' +
      '<span class="cost"></span>' + (u.id === 'repair' ? '' : '<span class="lv"></span>');
    // pointerdown reagiert sofort beim Antippen
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); buy(u.id); });
    // Tastatur (Enter/Leertaste)
    b.addEventListener('click', ev => { if (ev.detail === 0) buy(u.id); });
    bar.appendChild(b);
    barButtons[u.id] = { b, cost: b.querySelector('.cost'), lv: b.querySelector('.lv') };
  }
}
function renderBar() {
  if (!S) return;
  for (const u of UPGRADES) {
    const el = barButtons[u.id];
    const cost = upgradeCost(u);
    el.cost.textContent = '🪙 ' + cost;
    if (el.lv) { const t = tier(S.lv[u.id]); el.lv.textContent = 'Stufe ' + S.lv[u.id] + (t ? ' · ' + TIER_NAMES[t] : ''); }
    el.b.disabled = phase !== 'play' || S.coins < cost || (u.id === 'repair' && S.hp >= S.maxHp);
  }
}

// ====== Bildschirme ======
const overlay = document.getElementById('overlay');
const pauseBtn = document.getElementById('pauseBtn');
function showStart() {
  phase = 'start';
  overlay.className = '';
  overlay.innerHTML = '<div class="card"><h1>🏰 Burg-Spiel</h1><p class="sub">Eine Idee von Felix</p>' +
    '<ul><li>Gegner greifen deine Burg an. Die Türme schießen von selbst.</li>' +
    '<li><b>Tippe</b> auf Gegner, um selbst zu kämpfen.</li>' +
    '<li><b>Tippe</b> auf Münzen, um sie einzusammeln.</li>' +
    '<li><b>Tippe</b> auf die Häuser im Hof: Dann kommen 10 Kämpfer heraus. Nach 20 Siegen ruhen sie sich aus und 10 neue kommen.</li>' +
    '<li>Kaufe unten mit deinen Münzen Upgrades.</li></ul>' +
    '<button class="big" id="go">Spielen!</button>' + (best ? '<p class="stat">Rekord: Welle ' + best + '</p>' : '') + '</div>';
  document.getElementById('go').onclick = () => { newGame(); phase = 'play'; overlay.className = 'hidden'; pauseBtn.style.display = 'block'; renderBar(); };
}
function gameOver() {
  phase = 'over';
  pauseBtn.style.display = 'none';
  const reached = S.wave;
  const isBest = reached > best;
  if (isBest) { best = reached; try { localStorage.setItem('burg-best', best); } catch (e) {} }
  overlay.className = '';
  overlay.innerHTML = '<div class="card"><h1>Die Burg ist gefallen!</h1>' +
    '<p class="stat">Du hast bis <b>Welle ' + reached + '</b> durchgehalten.</p>' +
    (isBest ? '<p class="stat">🏆 Neuer Rekord!</p>' : '<p class="stat">Rekord: Welle ' + best + '</p>') +
    '<br><button class="big" id="again">Nochmal!</button></div>';
  document.getElementById('again').onclick = () => { newGame(); phase = 'play'; overlay.className = 'hidden'; pauseBtn.style.display = 'block'; renderBar(); };
  renderBar();
}
function pause() {
  if (phase !== 'play') return;
  phase = 'pause';
  overlay.className = '';
  overlay.innerHTML = '<div class="card"><h1>Pause</h1><br><button class="big" id="resume">Weiter</button></div>';
  document.getElementById('resume').onclick = () => { phase = 'play'; overlay.className = 'hidden'; renderBar(); };
  renderBar();
}
pauseBtn.addEventListener('click', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'Escape') { if (phase === 'play') pause(); } });

cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  onTap((ev.clientX - r.left) / scale, (ev.clientY - r.top) / scale);
});

// ====== Hauptschleife ======
let last = performance.now(), barTimer = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (phase === 'play') {
    update(dt);
    barTimer -= dt;
    if (barTimer <= 0) { barTimer = 0.25; renderBar(); }
  }
  draw();
  requestAnimationFrame(loop);
}
buildBackground();
buildBar();
newGame();
showStart();
renderBar();
resize();
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));
requestAnimationFrame(loop);
</script>
